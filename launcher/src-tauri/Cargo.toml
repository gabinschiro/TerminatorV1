[package]
name = "terminator-launcher"
version = "0.1.0"
description = "TerminatorV1 launcher — Tauri desktop app"
authors = ["TerminatorV1"]
edition = "2021"

[lib]
name = "terminator_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
